name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release, arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          xcodebuild \
            -project "Desk Controller.xcodeproj" \
            -scheme "Desk Controller" \
            -configuration Release \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      # Zip with ditto first: uploading the .app folder directly would lose
      # the executable bit and symlinks.
      - name: Zip the .app
        run: |
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/Desk Controller.app" \
            "Desk-Controller.zip"

      - name: Upload the .app
        uses: actions/upload-artifact@v4
        with:
          name: Desk-Controller-${{ github.sha }}
          path: Desk-Controller.zip
          retention-days: 30
